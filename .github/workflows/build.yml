

name: Build SleepGate 1.40

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK tools
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/build-tools" || true
          find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f \( -name apksigner -o -name zipalign \) | sort

      - name: Download Apktool
        shell: bash
        run: |
          set -e
          curl -L --fail --retry 3 -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

      - name: Decode APK
        shell: bash
        run: |
          set -e
          rm -rf decoded
          java -jar apktool.jar d SleepGate-1.39.apk -o decoded -f

      - name: Apply SleepGate 1.40 patch
        shell: bash
        run: |
          set -e
          python3 patch.py decoded

      - name: Set version to 1.40
        shell: bash
        run: |
          set -e
          if [ -f decoded/apktool.yml ]; then
            sed -i "s/versionName: .*/versionName: '1.40'/" decoded/apktool.yml || true
          fi

      - name: Rebuild APK
        shell: bash
        run: |
          set -e
          rm -rf unsigned
          java -jar apktool.jar b decoded -o unsigned.apk

      - name: Find Android build tools
        id: tools
        shell: bash
        run: |
          set -e
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -n "$BT"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          echo "BT=$BT" >> "$GITHUB_OUTPUT"
          echo "Using build-tools: $BT"

      - name: Generate signing key
        shell: bash
        run: |
          set -e
          keytool -genkeypair \
            -keystore sleepgate-release.jks \
            -storepass android \
            -keypass android \
            -alias sleepgate \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SleepGate, OU=SleepGate, O=SleepGate, L=Unknown, ST=Unknown, C=US"

      - name: Zipalign
        shell: bash
        run: |
          set -e
          "${{ steps.tools.outputs.BT }}/zipalign" -f -p 4 unsigned.apk SleepGate-1.40-aligned.apk

      - name: Sign APK
        shell: bash
        run: |
          set -e
          "${{ steps.tools.outputs.BT }}/apksigner" sign \
            --ks sleepgate-release.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out SleepGate-1.40.apk \
            SleepGate-1.40-aligned.apk
          "${{ steps.tools.outputs.BT }}/apksigner" verify --verbose SleepGate-1.40.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SleepGate-1.40
          path: SleepGate-1.40.apk
          if-no-files-found: error
          retention-days: 14
