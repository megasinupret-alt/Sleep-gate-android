name: Build SleepGate 1.40

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android build tools
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          find "$ANDROID_HOME/build-tools" -maxdepth 2 \
            \( -name apksigner -o -name zipalign \) -type f | sort

      - name: Download Apktool
        shell: bash
        run: |
          set -e
          curl -L --fail --retry 3 \
            -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

      - name: Decode SleepGate 1.39
        shell: bash
        run: |
          set -e
          rm -rf decoded
          java -jar apktool.jar d SleepGate-1.39.apk -o decoded -f

      - name: Patch Google OAuth WebView
        shell: bash
        run: |
          set -e
          python3 patch.py decoded

      - name: Set version 1.40
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          p = Path("decoded/apktool.yml")
          s = p.read_text()

          s = s.replace("versionName: 1.39", "versionName: 1.40")
          s = s.replace("versionCode: 39", "versionCode: 40")

          p.write_text(s)
          PY

      - name: Build unsigned APK
        shell: bash
        run: |
          set -e
          rm -f SleepGate-1.40-unsigned.apk
          java -jar apktool.jar b decoded -o SleepGate-1.40-unsigned.apk

      - name: Locate Android build tools
        id: android_tools
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)

          test -n "$BUILD_TOOLS"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"

      - name: Generate signing key
        shell: bash
        run: |
          set -e

          keytool -genkeypair -v \
            -keystore sleepgate-release.jks \
            -storepass sleepgate123 \
            -keypass sleepgate123 \
            -alias sleepgate \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SleepGate, OU=App, O=SleepGate, L=Unknown, ST=Unknown, C=US"

      - name: Zipalign APK
        shell: bash
        run: |
          set -e

          "${{ steps.android_tools.outputs.BUILD_TOOLS }}/zipalign" \
            -f 4 \
            SleepGate-1.40-unsigned.apk \
            SleepGate-1.40-aligned.apk

      - name: Sign APK
        shell: bash
        run: |
          set -e

          "${{ steps.android_tools.outputs.BUILD_TOOLS }}/apksigner" sign \
            --ks sleepgate-release.jks \
            --ks-pass pass:sleepgate123 \
            --key-pass pass:sleepgate123 \
            --out SleepGate-1.40.apk \
            SleepGate-1.40-aligned.apk

      - name: Verify APK
        shell: bash
        run: |
          set -e

          "${{ steps.android_tools.outputs.BUILD_TOOLS }}/apksigner" verify \
            --verbose \
            SleepGate-1.40.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SleepGate-1.40
          path: SleepGate-1.40.apk
          if-no-files-found: error
          retention-days: 14
